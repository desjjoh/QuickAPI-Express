services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quickapi_disposable_test
      MYSQL_USER: quickapi_test_user
      MYSQL_PASSWORD: quickapi_test_password
      MYSQL_ROOT_PASSWORD: quickapi_test_root_password
    ports:
      - '127.0.0.1:3308:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
