name: Release image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git-ref:
        description: Full commit SHA on main with successful push CI
        required: true
        type: string
      dry-run:
        description: Verify the candidate without logging in or publishing
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-image
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.CONTAINER_REPOSITORY || github.repository }}
  TRIVY_SCANNER_IMAGE: aquasec/trivy:latest
  REGCTL_IMAGE: ghcr.io/regclient/regctl:latest

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Require successful main CI for the exact source commit
        id: source
        env:
          REQUESTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.git-ref }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'A full lowercase commit SHA is required'; exit 1; }
          relationship="$(gh api "repos/$GITHUB_REPOSITORY/compare/$REQUESTED_SHA...main" --jq .status)"
          [[ "$relationship" == identical || "$relationship" == ahead ]] || { echo 'Commit must belong to main'; exit 1; }
          ci_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REQUESTED_SHA&event=push&branch=main&per_page=100" --jq '.workflow_runs[0] | [.id, .conclusion] | @tsv')"
          read -r ci_id conclusion <<< "$ci_run"
          [[ "$ci_id" =~ ^[0-9]+$ ]] || exit 1
          echo "ci-run-id=$ci_id" >> "$GITHUB_OUTPUT"
          [[ "$conclusion" == success ]] || { echo 'Latest push CI for this main commit must succeed'; exit 1; }
          image="${REGISTRY}/${IMAGE_REPOSITORY,,}"
          [[ "$image" =~ ^[a-z0-9][a-z0-9.:-]*/[a-z0-9][a-z0-9._/-]*$ ]] || exit 1
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          publish=true
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DRY_RUN" == true ]]; then publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - name: Verify release tooling
        run: npm run test:release
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@v4
      - name: Prepare candidate metadata
        id: metadata
        run: |
          mkdir -p "$RUNNER_TEMP/release-candidate" "$RUNNER_TEMP/release-evidence"
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build one unpublished release candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: false
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/release-candidate/image.tar
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}

      - name: Smoke-test the unpublished candidate
        id: smoke
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -o pipefail
          node .github/scripts/release-candidate.cjs smoke "$RUNNER_TEMP/release-candidate/image.tar" "$RUNNER_TEMP/release-evidence" 2>&1 | tee "$RUNNER_TEMP/release-evidence/smoke.log"
      - name: Scan the same candidate and retain its attestations
        if: always() && steps.build.outcome == 'success'
        id: scan
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          RELEASE_SCAN_CACHE: ${{ runner.temp }}/trivy-cache
        run: node .github/scripts/release-candidate.cjs scan "$RUNNER_TEMP/release-candidate/image.tar" "$RUNNER_TEMP/release-evidence"
      - name: Verify bound release evidence
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: node .github/scripts/release-candidate.cjs verify "$RUNNER_TEMP/release-candidate/image.tar" "$RUNNER_TEMP/release-evidence"

      - name: Verify digest-preserving publication in a disposable registry
        env:
          RELEASE_REGISTRY_TEST: 'true'
          RELEASE_TEST_ARCHIVE: ${{ runner.temp }}/release-candidate/image.tar
          RELEASE_TEST_EVIDENCE: ${{ runner.temp }}/release-evidence
        run: |
          set -o pipefail
          npm run test:release:registry 2>&1 | tee "$RUNNER_TEMP/release-evidence/registry-test.log"

      - name: Log in only after candidate approval
        if: steps.source.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      - name: Publish the verified archive and promote by digest
        if: steps.source.outputs.publish == 'true'
        env:
          RELEASE_IMAGE: ${{ steps.source.outputs.image }}
          RELEASE_TAGS: |
            ${{ steps.source.outputs.image }}:${{ steps.source.outputs.sha }}
            ${{ steps.source.outputs.image }}:${{ steps.metadata.outputs.version }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: node .github/scripts/release-publish.cjs "$RUNNER_TEMP/release-candidate/image.tar" "$RUNNER_TEMP/release-evidence"

      - name: Record workflow identity
        if: always() && steps.source.outcome == 'success'
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          CI_RUN_ID: ${{ steps.source.outputs.ci-run-id }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-evidence"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({sourceSha:process.env.RELEASE_SHA,buildDigest:process.env.BUILD_DIGEST,ciRunId:process.env.CI_RUN_ID,workflowRun:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,repository:process.env.GITHUB_REPOSITORY},null,2))' "$RUNNER_TEMP/release-evidence/workflow.json"
      - name: Retain release and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-evidence/
            security/container-vulnerability-exceptions.json
            docs/security.md
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
