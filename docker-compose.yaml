# Local development only. Test infrastructure uses a separate Compose project.
name: quickapi-express-dev

services:
  api:
    stop_grace_period: 40s
    build:
      context: .
      dockerfile: Dockerfile
    image: quickapi-express:latest
    container_name: quickapi-express-api
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_DATABASE: quickapi
      TZ: America/Toronto
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    command: ['node', 'dist/index.js']
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quickapi
  mysql:
    image: mysql:8.4.6
    container_name: quickapi-express-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quickapi
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: America/Toronto
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '127.0.0.1:3309:3306'
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE --execute="SELECT 1"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - quickapi

volumes:
  mysql_data:

networks:
  quickapi:
